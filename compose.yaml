# Inkling-2-Mini EXLR8 + Melded DFlash2 on one NVIDIA DGX Spark (GB10)
# Serves an OpenAI-compatible API on http://127.0.0.1:${PORT:-8100}/v1
#
#   cp .env.example .env
#   huggingface-cli download kindlingai/inkling-2-mini-exlr8-k2-k3-k4 \
#     --local-dir ./models/inkling-2-mini-exlr8-k2-k3-k4
#   docker compose up -d
#   docker compose logs -f

name: inkling-2-mini-1x-spark
services:
  gr8:
    image: ${GR8_IMAGE:-ghcr.io/kindlingai/gr8:main}
    container_name: inkling-2-mini-1x-spark
    entrypoint: ["/bin/bash", "/recipe/serve.sh"]
    env_file:
      - path: .env
        required: false
    environment:
      - MODEL_DIR=/models/inkling-2-mini-exlr8-k2-k3-k4
      - WORK_DIR=/tmp/ink2-gr8
      - GR8_ROOT=/opt/gr8
      - PY=/usr/bin/python3
    network_mode: host
    pid: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ulimits:
      memlock: -1
      core: 0
    cap_drop: [ALL]
    cap_add: [IPC_LOCK]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=2g,mode=1777
    oom_score_adj: 1000
    init: true
    stop_grace_period: 30s
    volumes:
      - ./serve.sh:/recipe/serve.sh:ro
      - ${MODEL_DIR:-./models/inkling-2-mini-exlr8-k2-k3-k4}:/models/inkling-2-mini-exlr8-k2-k3-k4:ro
